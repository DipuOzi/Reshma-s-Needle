<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <title>Reshma's Needle — tailor's needle cursor (clickable)</title>
  <!-- Same needle; the gold eye is the only change, so clickable areas read
       as a small highlight rather than a different cursor. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 32 28.2 8.7" fill="none" stroke="#5E8A66" stroke-width="3.6" />
    <path d="M4 32 28.2 8.7" fill="none" stroke="#7CA982" stroke-width="2.4" />
    <ellipse cx="26.4" cy="10.5" rx="2.4" ry="1" transform="rotate(-45 26.4 10.5)" fill="#E8CE9C" stroke="#5E8A66" stroke-width="0.8" />
  </g>
</svg>
